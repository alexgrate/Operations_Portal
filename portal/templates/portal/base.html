{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dash MFB — Operations Portal</title>
    <link rel="stylesheet" href="{% static 'css/dashboard.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css" rel="stylesheet" />
</head>

<body>

    <header class="top-bar">
        <div class="head">
            <img src="{% static 'images/DASH LOGO.jpg' %}" alt="Logo">
            <div class="head-text">
                <span class="head-name">Dash MFB</span>
                <span class="head-sub">Operations Portal</span>
            </div>
        </div>

        <nav class="tabs" role="tablist" >
            <button class="tab-btn active" data-tab="board" role="tab">Task Board</button>
            <button class="tab-btn" data-tab="catalog" role="tab">Process Catalog</button>
            <button class="tab-btn" data-tab="analytics" role="tab">Analytics</button>
        </nav>

        <div class="alerts-wrap">
            <button id="alertsBtn" class="alerts-btn" aria-label="Alerts">
                <i class="ri-alarm-warning-line"></i>
                <span id="alertsCount" class="alerts-count hidden">0</span>
            </button>
            <div id="alertsPanel" class="alerts-panel hidden">
                <div class="alerts-panel-header">Escalation alerts</div>
                <div id="alertsList" class="alerts-list"></div>
            </div>
        </div>

        <div class="user-wrap">
            <span class="user-name">{{ user.get_full_name|default:user.username }}</span>
            <form method="post" action="{% url 'portal-logout' %}">
                {% csrf_token %}
                <button type="submit" class="logout-btn" title="Log out">
                    <i class="ri-logout-box-r-line"></i>
                </button>
            </form>
        </div>

    </header>

    {% if messages %}
        <div class="page-messages">
            {% for message in messages %}
                <p class="page-alert page-alert--{{ message.tags|default:'info' }}"
                   role="{% if message.level >= 30 %}alert{% else %}status{% endif %}">
                    {{ message }}
                </p>
            {% endfor %}
        </div>
    {% endif %}

    {% block content %}

    {% endblock content %}

</body>

</html>
