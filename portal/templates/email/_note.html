{% comment %}A callout: a returned reason, a warning, a confirmation.{% endcomment %}
<tr>
  <td style="padding:20px 28px 0;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
           style="background:{{ bg|default:'#f4edf6' }}; border-left:3px solid {{ accent|default:'#4f1a60' }};
                  border-radius:0 8px 8px 0;">
      <tr>
        <td style="padding:14px 16px;">
          {% if label %}
            <p style="margin:0 0 5px; font:600 10px/1.3 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;
                      color:{{ accent|default:'#4f1a60' }}; letter-spacing:.09em;
                      text-transform:uppercase;">{{ label }}</p>
          {% endif %}
          <p style="margin:0; font:400 14px/1.6 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;
                    color:#1d1720; white-space:pre-line;">{{ text }}</p>
        </td>
      </tr>
    </table>
  </td>
</tr>
