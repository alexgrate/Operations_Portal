{% comment %}One label/value row inside the facts table.{% endcomment %}
<tr>
  <td style="padding:9px 14px; border-bottom:1px solid #edeaf0;
             font:400 12px/1.4 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;
             color:#7b7280; white-space:nowrap; vertical-align:top;">{{ label }}</td>
  <td style="padding:9px 14px; border-bottom:1px solid #edeaf0; text-align:right;
             font:{% if strong %}600{% else %}400{% endif %} 13px/1.4 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;
             color:{{ tone|default:'#1d1720' }}; vertical-align:top;
             word-break:break-word; overflow-wrap:anywhere;">{{ value }}</td>
</tr>
